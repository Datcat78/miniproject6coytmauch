{% extends 'planner/base.html' %}

{# Used by both the Add and Edit pages; the Edit page also passes `assignment`. #}
{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h3 mb-4">{{ page_title }}</h1>

                <form method="post" novalidate>
                    {% csrf_token %}
                    {% include 'planner/includes/form_fields.html' %}

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-save"></i> {% if assignment %}Save Changes{% else %}Save Assignment{% endif %}
                        </button>
                        <a href="{% if assignment %}{% url 'assignment_detail' assignment.pk %}{% else %}{% url 'assignment_list' %}{% endif %}"
                           class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
