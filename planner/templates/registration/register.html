{% extends 'planner/base.html' %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-sm-10 col-md-8 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h3 text-center mb-1">Create an account</h1>
                <p class="text-center text-body-secondary mb-4">Start tracking your assignments in under a minute.</p>

                <form method="post" novalidate>
                    {% csrf_token %}
                    {% include 'planner/includes/form_fields.html' %}
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-person-plus"></i> Register
                    </button>
                </form>
            </div>
            <div class="card-footer bg-body text-center py-3">
                Already have an account? <a href="{% url 'login' %}">Log in</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
